<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Moki ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Dancing+Script:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<!--
  ============================  HOW TO EDIT  ============================
  1) LETTER TEXT  → scroll to the "EDIT YOUR LETTER HERE" block in the <script> at the bottom.
  2) MUSIC        → put your song in the same folder as this file, name it  music.mp3
                    (or change MUSIC_SRC below). Visitors can also tap the ♫ button to pick a file.
                    Music never autoplays: it starts only when someone taps play.
  3) SHARING      → upload this file AND music.mp3 together to any free host
                    (Netlify Drop, GitHub Pages, Cloudflare Pages) and send her the link.
  =======================================================================
-->
<style>
:root{--cream:#f6ecd9;--champ:#ead9b5;--rose:#d99aa2;--burg:#5e1424;--wine:#2a0a12;--gold:#c9a24b;--ink:#3b2314}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#4a1220 0%,#2a0a12 55%,#150408 100%);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fl{z-index:1}#fx{z-index:7}
.scene{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:opacity 1.2s ease,visibility 1.2s}
.scene.out,.scene:not(.on){opacity:0;visibility:hidden}
#s1{opacity:1;visibility:visible}#s1.out{opacity:0;visibility:hidden}

/* ---------- gift box ---------- */
.gift{position:relative;width:190px;height:200px;cursor:pointer;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 22px 28px rgba(0,0,0,.55));outline:none}
.gift:focus-visible{outline:2px dashed var(--gold);outline-offset:24px}
.glow{position:absolute;inset:-90px;background:radial-gradient(circle,rgba(255,214,120,.5),rgba(255,214,120,0) 62%);animation:pulse 2.8s ease-in-out infinite;z-index:-1;transition:transform 1.4s,opacity 1.4s}
.base{position:absolute;bottom:0;left:12px;right:12px;height:122px;border-radius:3px 3px 8px 8px;background:linear-gradient(90deg,#4d101e,#8c2339 46%,#4d101e);box-shadow:inset 0 0 0 3px rgba(201,162,75,.6),inset 0 0 0 8px rgba(0,0,0,.14)}
.base::before,.lid::before{content:"";position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;background:linear-gradient(90deg,#a47d2c,#f1d98e,#a47d2c)}
.base::after{content:"❦";position:absolute;left:0;right:0;bottom:12px;text-align:center;color:rgba(241,217,142,.7);font-size:20px}
.lid{position:absolute;left:0;right:0;bottom:116px;height:58px;border-radius:5px;background:linear-gradient(90deg,#3f0c18,#7a1d31 46%,#3f0c18);box-shadow:inset 0 0 0 3px rgba(201,162,75,.7);transition:transform 1s cubic-bezier(.2,.9,.25,1),opacity .9s .15s}
.bow{position:absolute;top:-36px;left:50%;width:46px;height:46px;border:8px solid #e5c56f;border-radius:50% 50% 0 50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.bow.l{margin-left:-54px;transform:rotate(-12deg)}.bow.r{margin-left:8px;transform:scaleX(-1) rotate(-12deg)}
.knot{position:absolute;top:-16px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#c9a24b 70%)}
.gift.open{animation:none}
.gift.open .lid{transform:translateY(-190px) rotate(-16deg);opacity:0}
.gift.open .glow{transform:scale(3);opacity:0}
.hint{margin-top:64px;font-style:italic;font-size:clamp(1.15rem,4.6vw,1.5rem);letter-spacing:.04em;color:var(--champ);animation:breathe 3s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0}
@keyframes float{50%{transform:translateY(-12px) rotate(.8deg)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
@keyframes breathe{50%{opacity:.45}}

/* ---------- letter ---------- */
#s2{opacity:0;visibility:hidden}#s2.on{opacity:1;visibility:visible;transition:opacity .8s}
.paper{position:relative;width:min(92vw,640px);border-radius:3px 7px 4px 8px;
 background:radial-gradient(ellipse at 20% 10%,rgba(255,250,235,.7),transparent 60%),radial-gradient(ellipse at 85% 95%,rgba(150,95,40,.28),transparent 55%),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .15 0 0 0 .25 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 linear-gradient(160deg,#f3e3c1,#e8d3a6);
 box-shadow:0 35px 70px rgba(0,0,0,.6),inset 0 0 70px rgba(125,75,25,.38),inset 0 0 6px rgba(90,50,10,.55);
 transform-origin:50% 0;opacity:0;color:var(--ink)}
#s2.on .paper{animation:unfold 1.5s cubic-bezier(.2,.8,.25,1) forwards}
@keyframes unfold{0%{transform:perspective(1100px) rotateX(-88deg) scaleY(.15);opacity:0}50%{opacity:1}100%{transform:perspective(1100px) rotateX(0) scaleY(1);opacity:1}}
.paper::before{content:"";position:absolute;inset:11px;border:1px solid rgba(120,75,30,.5);outline:1px solid rgba(120,75,30,.25);outline-offset:4px;pointer-events:none;border-radius:2px}
#scroll{max-height:84vh;max-height:84dvh;overflow:auto;padding:clamp(34px,7vw,58px) clamp(26px,7vw,64px) clamp(30px,5vw,44px);scrollbar-width:thin;scrollbar-color:#b58d52 transparent}
.seal{width:62px;height:62px;margin:0 auto 14px;border-radius:50% 46% 52% 48%;display:grid;place-items:center;font:2rem/1 'Pinyon Script',cursive;color:#f6d9c8;background:radial-gradient(circle at 35% 30%,#d4445c,#8e1a2f 62%,#5e0f1e);box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.08),inset 0 -3px 5px rgba(0,0,0,.3);opacity:0;transform:scale(2) rotate(-20deg)}
#s2.on .seal{animation:stamp .5s 1.3s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{to{opacity:1;transform:none}}
#text p{font:500 clamp(1.18rem,3.9vw,1.5rem)/1.6 'Dancing Script','Segoe Script',cursive;margin-bottom:.85em;min-height:1em}
#text p.greet{font:clamp(2rem,7.5vw,2.8rem)/1.2 'Pinyon Script',cursive;color:var(--burg);margin-bottom:.5em}
#text p.sign{margin:1.2em 0 0;text-align:right}
#text p.name{font:clamp(2rem,7vw,2.6rem)/1.2 'Pinyon Script',cursive;color:var(--burg);text-align:right}
#text p.ps{margin-top:1em;font-size:clamp(1.05rem,3.5vw,1.3rem);color:#6b3a22}
#text p.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;background:var(--burg);vertical-align:-.12em;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.more{display:block;margin:30px auto 4px;padding:14px 34px;border:1px solid var(--gold);border-radius:40px;background:linear-gradient(135deg,#6d1829,#4a0e1b);color:#f6e3a8;font:italic 500 1.25rem 'Cormorant Garamond',serif;letter-spacing:.08em;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s,visibility 1.2s,box-shadow .3s;box-shadow:0 0 0 4px rgba(201,162,75,.15),0 8px 18px rgba(60,10,20,.4);position:relative;overflow:hidden}
.more.show{opacity:1;visibility:visible;transform:none}
.more:hover,.more:focus-visible{box-shadow:0 0 0 4px rgba(201,162,75,.35),0 0 26px rgba(255,214,120,.55);outline:none}
.more::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,240,190,.5),transparent);animation:shine 3.4s infinite}
@keyframes shine{60%,100%{left:130%}}

/* ---------- finale ---------- */
#finale{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:28px;text-align:center;background:radial-gradient(ellipse at center,rgba(60,12,26,.9),rgba(14,3,7,.97));opacity:0;visibility:hidden;transition:opacity 1.6s,visibility 1.6s}
#finale.on{opacity:1;visibility:visible}
#finale div{max-width:560px}
#finale span{display:block;opacity:0;transform:translateY(14px);filter:blur(6px)}
#finale.on span{animation:rise 1.8s forwards}
#finale .l1{font:clamp(2.2rem,8vw,3.4rem)/1.2 'Pinyon Script',cursive;color:#f1d98e;animation-delay:1.2s}
#finale .l2{font:italic 500 clamp(1.25rem,4.6vw,1.7rem)/1.6 'Cormorant Garamond',serif;color:var(--champ);margin:22px 0;animation-delay:3.4s}
#finale .l3{font-size:2.4rem;animation-delay:6s;animation-name:rise,beat !important;animation-duration:1.8s,1.6s !important;animation-iteration-count:1,infinite !important;animation-fill-mode:forwards,none !important}
#finale button{margin-top:26px;background:none;border:0;color:rgba(234,217,181,.7);font:italic 1.05rem 'Cormorant Garamond',serif;text-decoration:underline;cursor:pointer;opacity:0;transition:opacity 1.5s 8s}
#finale.on button{opacity:1}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes beat{50%{transform:scale(1.18)}}

/* ---------- music ---------- */
#player{position:fixed;z-index:10;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:40px;background:rgba(30,8,14,.72);border:1px solid rgba(201,162,75,.55);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
#player button,#up{width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,162,75,.6);background:rgba(94,20,36,.8);color:#f1d98e;display:grid;place-items:center;cursor:pointer;font-size:1rem;padding:0}
#player button:hover,#up:hover,#player :focus-visible{background:#8c2339;outline:none}
#player svg{width:15px;height:15px;fill:currentColor}
#eq{display:flex;align-items:flex-end;gap:2px;height:16px}
#eq i{width:3px;height:4px;background:var(--gold);border-radius:2px}
#player.playing #eq i{animation:eq 1s ease-in-out infinite}
#eq i:nth-child(2){animation-delay:-.3s!important}#eq i:nth-child(3){animation-delay:-.6s!important}#eq i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{50%{height:16px}}
#vol{width:68px;accent-color:var(--gold);cursor:pointer}
#note{position:fixed;z-index:10;left:max(12px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 56px);max-width:260px;padding:8px 12px;border-radius:10px;background:rgba(30,8,14,.88);border:1px solid rgba(201,162,75,.4);font-size:.95rem;font-style:italic;color:var(--champ);opacity:0;transition:opacity .4s;pointer-events:none}
#note.show{opacity:1}
@media (prefers-reduced-motion:reduce){.gift,.glow,.hint,.more::after{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fl"></canvas><canvas id="fx"></canvas>

<section class="scene on" id="s1">
  <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">
    <div class="glow"></div>
    <div class="lid"><i class="bow l"></i><i class="bow r"></i><i class="knot"></i></div>
    <div class="base"></div>
  </div>
  <p class="hint">Something special is waiting for you...</p>
</section>

<section class="scene" id="s2">
  <article class="paper">
    <div id="scroll">
      <div class="seal">M</div>
      <div id="text"></div>
      <button class="more" id="more">More Is Coming...</button>
    </div>
  </article>
</section>

<section id="finale" aria-live="polite">
  <div>
    <span class="l1">Thought this was the end?</span>
    <span class="l2">There’s still something waiting for you. A little present is making its way to you... but you’ll have to wait to discover what it is.</span>
    <span class="l3">❤️</span>
    <button id="back">Back to the letter</button>
  </div>
</section>

<div id="note"></div>
<div id="player">
  <button id="pp" aria-label="Play music"></button>
  <span id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <input id="vol" type="range" min="0" max="1" step=".01" value=".6" aria-label="Volume">
  <label id="up" title="Choose your own song" tabindex="0">♫<input id="file" type="file" accept="audio/*" hidden></label>
</div>

<script>
/* ===================== EDIT YOUR LETTER HERE ===================== */
const LETTER = [
  { cls:'greet', t:'Hey,' },
  { t:'I know it is late, and thanks for waiting and telling me that I am late. That means you care. I love it!' },
  { t:'To this day, I knew you are a great hearted, sometimes bold, maybe too bold? Haha, whatever. I knew that you were a kind soul.' },
  { t:'You love watching anime and reading books, which I also like. Isn’t that great, two friends that like the same things?' },
  { t:'You are like a tiny little sister to me. I love you.' },
  { t:'I wish you so many ages. I hope you never die. I wish you great health so you can spread kindness. I wish you strength so you can protect, and never run out of stamina so that you can have energy to push and kick, maybe kill? Not that extreme? Okay.' },
  { cls:'sign', t:'Xo.' },
  { t:'I wish you a great birthday, Komila' }
];
const MUSIC_SRC = 'music.mp3';   // put your song next to this file with this name
/* ================================================================= */

const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bg=$('#bg'),fl=$('#fl'),fx=$('#fx'),bc=bg.getContext('2d'),fc=fl.getContext('2d'),xc=fx.getContext('2d');
let W,H,D;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[bg,fl,fx].forEach(c=>{c.width=W*D;c.height=H*D;c.getContext('2d').setTransform(D,0,0,D,0,0)})}
addEventListener('resize',size);size();
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], clamp=v=>Math.max(0,Math.min(1,v));

/* ambient petals + sparkles */
const PC=['#e7b5b9','#d99aa2','#f3d6d0','#c9747f','#f0c9a8'];
const mkPetal=init=>({x:rnd(0,W),y:init?rnd(0,H):-20,r:rnd(6,13),vy:rnd(.3,.9),ph:rnd(0,6),rot:rnd(0,6),vr:rnd(-.03,.03),c:pick(PC)});
const petals=Array.from({length:reduce?8:24},()=>mkPetal(true));
const stars=Array.from({length:reduce?14:46},()=>({x:rnd(0,1),y:rnd(0,1),s:rnd(.6,1.8),p:rnd(0,6)}));
function ambient(t){
  bc.clearRect(0,0,W,H);
  bc.fillStyle='#ffe29a';
  stars.forEach(s=>{bc.globalAlpha=.15+.75*Math.abs(Math.sin(t*.0014+s.p));bc.beginPath();bc.arc(s.x*W,s.y*H,s.s,0,7);bc.fill()});
  petals.forEach((p,i)=>{p.y+=p.vy;p.x+=Math.sin(t*.001+p.ph)*.6;p.rot+=p.vr;if(p.y>H+20)petals[i]=mkPetal(false);
    bc.globalAlpha=.7;bc.fillStyle=p.c;bc.save();bc.translate(p.x,p.y);bc.rotate(p.rot);bc.beginPath();bc.ellipse(0,0,p.r,p.r*.55,0,0,7);bc.fill();bc.restore()});
  bc.globalAlpha=1;
}

/* flowers */
const FC=[['#b5314c','#e8909b'],['#e8a6ad','#fbe3e0'],['#f3d27a','#fff4cf'],['#8e2038','#d4687a'],['#f6e9d4','#e9c98f']];
const flowers=[];let flA=1,flTarget=1;
function addFlower(){const x0=rnd(0,W);flowers.push({x0,tx:x0+rnd(-60,60),ty:H*rnd(.14,.7),sw:rnd(-90,90),t:0,sp:rnd(.005,.009),r:rnd(18,40),n:6+(Math.random()*4|0),rot:rnd(0,6),c:pick(FC)})}
function drawFlower(f){
  const pt=u=>{const a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;return[a*f.x0+b*(f.x0+f.sw)+c*f.tx,a*(H+10)+b*((H+f.ty)/2)+c*f.ty]};
  const s=1-Math.pow(1-clamp(f.t/.55),3);
  fc.strokeStyle='#5d7a47';fc.lineWidth=2.5;fc.lineCap='round';fc.beginPath();
  for(let i=0;i<=14;i++){const [x,y]=pt(s*i/14);i?fc.lineTo(x,y):fc.moveTo(x,y)}fc.stroke();
  const p=clamp((f.t-.5)/.5);if(p<=0)return;const e=1-Math.pow(1-p,3),R=f.r*e;
  fc.save();fc.translate(f.tx,f.ty);
  for(let ring=0;ring<2;ring++){const rr=ring?R*.62:R;fc.fillStyle=f.c[ring];
    for(let i=0;i<f.n;i++){fc.save();fc.rotate(f.rot+p*.6+i*6.2832/f.n+ring*3.14/f.n);fc.beginPath();fc.ellipse(0,-rr*.58,rr*.3,rr*.6,0,0,7);fc.fill();fc.restore()}}
  fc.fillStyle='#d9a93c';fc.beginPath();fc.arc(0,0,R*.2,0,7);fc.fill();fc.restore();
}

/* fireworks + confetti */
const sparks=[],rockets=[];
const GC=['#ffd770','#ff9fb0','#fff1c1','#ff7a90','#f6c453','#ffffff','#d98cff'];
function rocket(x){rockets.push({x:x??rnd(W*.12,W*.88),y:H,ty:H*rnd(.12,.42),v:H*.011+rnd(0,3),c:pick(GC)})}
function explode(x,y,c){const n=reduce?30:72,c2=pick(GC);for(let i=0;i<n;i++){const a=i/n*6.2832+rnd(0,.1),sp=rnd(1.4,4.6);sparks.push({x,y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,m:rnd(65,100),c:i%3?c:c2})}}
function confetti(x,y,n){for(let i=0;i<n;i++){const a=-1.57+rnd(-1.1,1.1),sp=rnd(6,15);sparks.push({k:1,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,m:rnd(150,230),c:pick(GC.concat(['#e7b5b9','#c9747f'])),w:rnd(5,10),h:rnd(3,7),r:rnd(0,6),vr:rnd(-.3,.3)})}}
function drawFx(){
  xc.clearRect(0,0,W,H);xc.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y-=r.v;xc.strokeStyle=r.c;xc.lineWidth=2.5;xc.globalAlpha=.9;xc.beginPath();xc.moveTo(r.x,r.y);xc.lineTo(r.x,r.y+16);xc.stroke();if(r.y<=r.ty){explode(r.x,r.y,r.c);rockets.splice(i,1)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l++;if(s.l>s.m){sparks.splice(i,1);continue}
    const a=1-s.l/s.m;
    if(s.k){s.vx*=.985;s.vy=s.vy*.985+.16;s.x+=s.vx;s.y+=s.vy;s.r+=s.vr;xc.globalCompositeOperation='source-over';xc.globalAlpha=Math.min(1,a*2);xc.fillStyle=s.c;xc.save();xc.translate(s.x,s.y);xc.rotate(s.r);xc.scale(1,Math.cos(s.l*.15));xc.fillRect(-s.w/2,-s.h/2,s.w,s.h);xc.restore();xc.globalCompositeOperation='lighter'}
    else{s.px=s.x;s.py=s.y;s.vx*=.985;s.vy=s.vy*.985+.045;s.x+=s.vx;s.y+=s.vy;xc.globalAlpha=a;xc.strokeStyle=s.c;xc.lineWidth=2.2;xc.beginPath();xc.moveTo(s.px,s.py);xc.lineTo(s.x,s.y);xc.stroke()}}
  xc.globalAlpha=1;xc.globalCompositeOperation='source-over';
}
function loop(t){
  ambient(t);
  flA+=(flTarget-flA)*.02;fc.clearRect(0,0,W,H);fc.globalAlpha=flA;
  flowers.forEach(f=>{f.t=Math.min(1,f.t+f.sp);drawFlower(f)});
  drawFx();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- opening the box ---------- */
const gift=$('#gift');let opened=false;
function openGift(){
  if(opened)return;opened=true;gift.classList.add('open');$('.hint').classList.add('gone');
  const r=gift.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+20;
  setTimeout(()=>{confetti(cx,cy,reduce?40:160);explode(cx,cy-60,'#ffd770');rocket(W*.25);rocket(W*.75)},250);
  for(let i=0;i<(reduce?10:30);i++)setTimeout(addFlower,300+i*85);
  for(let i=0;i<(reduce?5:16);i++)setTimeout(()=>rocket(),700+i*320);
  setTimeout(()=>$('#s1').classList.add('out'),2400);
  setTimeout(showLetter,3500);
}
gift.addEventListener('click',openGift);
gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});

/* ---------- letter typing ---------- */
let skip=false;
async function showLetter(){
  flTarget=.45;$('#s2').classList.add('on');
  await sleep(1700);
  const box=$('#text'),sc=$('#scroll');
  $('.paper').addEventListener('click',()=>skip=true);
  for(const item of LETTER){
    const p=document.createElement('p');p.className=item.cls||'';box.appendChild(p);p.classList.add('typing');
    for(const ch of item.t){
      if(skip){p.textContent=item.t;break}
      p.textContent+=ch;sc.scrollTop=sc.scrollHeight;
      await sleep(/[.!?]/.test(ch)?280:ch===','?150:rnd(18,38));
    }
    p.classList.remove('typing');sc.scrollTop=sc.scrollHeight;await sleep(skip?0:320);
  }
  $('#more').classList.add('show');sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
}

/* ---------- more is coming ---------- */
$('#more').addEventListener('click',()=>{
  $('#finale').classList.add('on');flTarget=.3;
  for(let i=0;i<(reduce?4:14);i++){setTimeout(()=>rocket(),400+i*480)}
  confetti(W/2,H*.9,reduce?30:90);
});
$('#back').addEventListener('click',()=>{$('#finale').classList.remove('on');flTarget=.45});

/* ---------- music ---------- */
const au=new Audio();au.loop=true;au.volume=.6;au.preload='none';
const pl=$('#player'),pp=$('#pp'),note=$('#note');let nt;
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
pp.innerHTML=PLAY;
function say(m){note.textContent=m;note.classList.add('show');clearTimeout(nt);nt=setTimeout(()=>note.classList.remove('show'),4200)}
function state(on){pl.classList.toggle('playing',on);pp.innerHTML=on?PAUSE:PLAY;pp.setAttribute('aria-label',on?'Pause music':'Play music')}
pp.addEventListener('click',async()=>{
  if(!au.src)au.src=MUSIC_SRC;
  if(!au.paused){au.pause();return}
  try{await au.play()}catch(e){au.removeAttribute('src');au.load();say('No song found yet. Tap ♫ to choose one.')}
});
au.addEventListener('play',()=>state(true));au.addEventListener('pause',()=>state(false));
$('#vol').addEventListener('input',e=>au.volume=+e.target.value);
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  au.src=URL.createObjectURL(f);
  try{await au.play();say('Now playing: '+f.name.replace(/\.[^.]+$/,''))}catch(_){say('Press play to start your song.')}
});
$('#up').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}});
</script>
</body>
